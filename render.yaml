services:
  - type: web
    name: letter-app
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build && pnpm drizzle-kit migrate
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: letter-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SNOVIO_CLIENT_ID
        sync: false
      - key: SNOVIO_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

databases:
  - name: letter-app-db
    databaseName: letterapp
    user: letterapp
    plan: free
